---
grails:
  profile: rest-api
  codegen:
    defaultPackage: restaurante_carlos
  reload:
    enabled: true
  gorm:
    reactor:
      events: false
  controllers:
    upload:
      maxFileSize: 5242880
      maxRequestSize: 5242880

info:
  app:
    name: "@info.app.name@"
    version: "@info.app.version@"
    grailsVersion: "@info.app.grailsVersion@"

server:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  tomcat:
    max-http-post-size: 5242880

spring:
  groovy:
    template:
      check-template-location: false
  servlet:
    multipart:
      max-file-size: 5MB 
      max-request-size: 5MB

# customize Spring Boot Actuator end-points
management:
  context-path: /api/management

# Configuración para manejo de imágenes
restaurant:
  images:
    # Directorio donde se guardarán las imágenes (fuera de src/main)
    upload-dir: /uploads/dishes
    # URL base para acceder a las imágenes (sin barra final)
    base-url: http://localhost:8080/api/images

---
grails:
  mime:
    disable:
      accept:
        header:
          userAgents:
            - Gecko
            - WebKit
            - Presto
            - Trident
    types:
      json:
        - application/json
        - text/json
      hal:
        - application/hal+json
        - application/hal+xml
      xml:
        - text/xml
        - application/xml
      atom: application/atom+xml
      css: text/css
      csv: text/csv
      js: text/javascript
      rss: application/rss+xml
      text: text/plain
      all: "*/*"
  urlmapping:
    cache:
      maxsize: 1000
  controllers:
    defaultScope: singleton
  converters:
    encoding: UTF-8
---
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false

dataSource:
  pooled: true
  jmxExport: true
  driverClassName: com.mysql.jdbc.Driver
  dialect: org.hibernate.dialect.MySQL5InnoDBDialect

environments:
  development:
    dataSource:
      dbCreate: create-drop
      url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE_DEV}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}

  test:
    dataSource:
      dbCreate: create-drop
      url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE_DEV}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}

  production:
    dataSource:
      dbCreate: create-drop
      url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE_DEV}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
      properties:
        jmxEnabled: true
        initialSize: 5
        maxActive: 50
        minIdle: 5
        maxIdle: 25
        maxWait: 10000
        maxAge: 600000
        timeBetweenEvictionRunsMillis: 5000
        minEvictableIdleTimeMillis: 60000
        validationQuery: SELECT 1
        validationQueryTimeout: 3
        validationInterval: 15000
        testOnBorrow: true
        testWhileIdle: true
        testOnReturn: false
        jdbcInterceptors: ConnectionState
        defaultTransactionIsolation: 2
