---
grails:
  profile: rest-api
  codegen:
    defaultPackage: restaurante_carlos
  reload:
    enabled: true 
  gorm:
    reactor:
      events: false

spring:
  main:
    banner-mode: "off"
  groovy:
    template:
      check-template-location: false

endpoints:
  enabled: false
  jmx:
    enabled: true

hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false

dataSource:
  pooled: true
  jmxExport: true
  driverClassName: com.mysql.jdbc.Driver  
  dialect: org.hibernate.dialect.MySQL5InnoDBDialect

environments:
  development:
    dataSource:
      dbCreate: create-drop
      url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}

  test:
    dataSource:
      dbCreate: update
      url: jdbc:h2:mem:testDb;MVCC=TRUE;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE

  production:
    dataSource:
      dbCreate: none
      url: jdbc:mysql://mysql5:3306/grails_db?useSSL=false&useUnicode=yes&characterEncoding=UTF-8
      username: grails
      password: 12345
      properties:
        jmxEnabled: true
        initialSize: 5
        maxActive: 50
        minIdle: 5
        maxIdle: 25
        maxWait: 10000
        maxAge: 600000
        timeBetweenEvictionRunsMillis: 5000
        minEvictableIdleTimeMillis: 60000
        validationQuery: SELECT 1
        validationQueryTimeout: 3
        validationInterval: 15000
        testOnBorrow: true
        testWhileIdle: true
        testOnReturn: false
        jdbcInterceptors: ConnectionState
        defaultTransactionIsolation: 2
