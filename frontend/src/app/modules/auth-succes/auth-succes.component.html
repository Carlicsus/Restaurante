<div class="auth-page">
  <!-- Pantalla de carga -->
  <div class="auth-content" *ngIf="isLoading && !hasError">
    <div class="brand">
      <img class="brand-logo" src="/logo.png" alt="Restaurante logo" />
      <h1 class="brand-title">Restaurante Griales</h1>
    </div>
    
    <div class="auth-card">
      <div class="spinner"></div>
      <h2 class="title">Autenticando...</h2>
      <p class="message">Por favor espera mientras procesamos tu inicio de sesión</p>
    </div>
  </div>

  <!-- Pantalla de error -->
  <div class="auth-content" *ngIf="hasError">
    <div class="brand">
      <img class="brand-logo" src="/logo.png" alt="Restaurante logo" />
      <h1 class="brand-title">Restaurante Griales</h1>
    </div>
    
    <div class="auth-card">
      <div class="error-icon">⚠️</div>
      <h2 class="title error-title">Error de Autenticación</h2>
      <p class="message error-message">{{ errorMessage }}</p>
      <button class="btn btn--primary" (click)="retryLogin()">
        Volver al inicio de sesión
      </button>
    </div>
  </div>
</div>
