<app-navbar-chef></app-navbar-chef>

<div class="dashboard-wrapper">

  <!-- Header -->
  <div class="dashboard-header">
    <h1>Hola, Chef</h1>
    <p>Administra pedidos, menús y órdenes en proceso.</p>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <span>Pedidos del Día</span>
      <strong>{{ stats.pedidosDia }}</strong>
    </div>

    <div class="stat-card">
      <span>En Preparación</span>
      <strong>{{ stats.enPreparacion }}</strong>
    </div>

    <div class="stat-card">
      <span>Listos para Entregar</span>
      <strong>{{ stats.listos }}</strong>
    </div>
  </div>

  <!-- Orders -->
  <div class="orders-section">
    <h2>Órdenes de Hoy</h2>

    <div class="order-item" *ngFor="let order of orders">
      <div class="order-info">
        <div class="order-header">
          <h4>Pedido #{{ order.id }}</h4>
          <span class="status-badge" [ngClass]="getStatusClass(order.status)">
            {{ getStatusLabel(order.status) }}
          </span>
        </div>
        <p>{{ order.items }}</p>
        <span class="order-time">{{ order.time }}</span>
      </div>

      <div class="order-actions">
        <button class="btn-primary" (click)="markAsInProcess(order.id)" [disabled]="order.status === 'en_proceso'">
          En Proceso
        </button>
        <button class="btn-success" (click)="markAsFinished(order.id)" [disabled]="order.status === 'finalizada'">
          Finalizada
        </button>
        <button class="btn-danger" (click)="markAsCanceled(order.id)" [disabled]="order.status === 'cancelada'">
          Cancelada
        </button>
      </div>
    </div>
  </div>

  <!-- Action -->
  <div class="dashboard-action">
    <button class="btn-primary" (click)="goToMenus()">
      Gestionar Menús
    </button>
  </div>

</div>
