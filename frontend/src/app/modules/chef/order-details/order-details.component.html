<app-navbar-chef></app-navbar-chef>

<div class="page-wrapper">
  <div class="content-wrapper">

    <h1 class="page-title">
      Detalles del Pedido <span>#GR-12045</span>
    </h1>

    <!-- Tabla de platillos -->
    <div class="table-card">
      <div class="table-header">
        <span>Platillo</span>
        <span>Cantidad</span>
        <span>Precio</span>
      </div>

      <div class="table-row" *ngFor="let item of orderItems">
        <span>{{ item.name }}</span>
        <span class="qty">{{ item.quantity }}</span>
        <span class="price">{{ formatCurrency(item.price) }}</span>
      </div>
    </div>

    <!-- Estado del pedido -->
    <div class="status-section">
      <h3>Estado del pedido</h3>

      <div class="status-steps">
        <div class="step" [class.active]="orderStatus >= 1">
          <span class="circle"></span>
          <span>Pedido recibido</span>
        </div>

        <div class="step" [class.active]="orderStatus >= 2">
          <span class="circle"></span>
          <span>En proceso</span>
        </div>

        <div class="step" [class.active]="orderStatus >= 3">
          <span class="circle"></span>
          <span>Listo para servir</span>
        </div>
      </div>
    </div>

    <!-- Acciones -->
    <div class="actions">
      <button class="btn secondary" (click)="markInProgress()">
        Marcar como en proceso
      </button>

      <button class="btn primary" (click)="markReady()">
        Marcar como listo
      </button>

      <button class="btn danger" (click)="openCancelModal()">
        Cancelar pedido
      </button>
    </div>

  </div>
</div>

<!-- MODAL CANCELAR PEDIDO -->
<div class="modal-backdrop" *ngIf="showCancelModal">
  <div class="modal-container">

    <div class="modal-header">
      <div class="warning-icon">⚠️</div>
      <h3>Cancelar Pedido</h3>
    </div>

    <p class="modal-description">
      Describe el motivo de la cancelación. Esta acción no se puede deshacer.
    </p>

    <label class="modal-label">Motivo</label>
    <textarea
      class="modal-textarea"
      placeholder="Ej: Ingrediente no disponible..."
      [(ngModel)]="cancelReason">
    </textarea>

    <div class="modal-actions">
      <button class="btn secondary" (click)="closeCancelModal()">
        Volver
      </button>

      <button class="btn danger" (click)="confirmCancelOrder()">
        Cancelar pedido
      </button>
    </div>

  </div>
</div>
