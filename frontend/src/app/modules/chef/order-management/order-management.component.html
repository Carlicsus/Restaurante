<app-navbar-chef></app-navbar-chef>

<div class="page-wrapper">
  <div class="content-wrapper">

    <h1 class="page-title">Órdenes del Día</h1>
    <p class="page-subtitle">
      Gestiona las órdenes del día en tiempo real.
    </p>

    <div class="orders-list">

      <div class="order-item" *ngFor="let order of orders">
        <div class="order-info">
          <h4>Pedido #{{ order.id }}</h4>
          <p class="items">{{ order.items }}</p>
          <span class="time">Hora solicitada: {{ order.time }}</span>
        </div>

        <div class="order-action">
          <button
            *ngIf="order.action === 'take'"
            class="btn secondary"
            (click)="takeOrder(order)">
            Tomar Pedido
          </button>

          <button
            *ngIf="order.action === 'ready'"
            class="btn secondary"
            (click)="markReady(order)">
            Marcar como Listo
          </button>

          <button
            *ngIf="order.action === 'cancel'"
            class="btn danger"
            (click)="openCancelModal(order)">
            Cancelar Orden
          </button>
        </div>
      </div>

    </div>

  </div>
</div>

<div class="modal-backdrop" *ngIf="showCancelModal">
  <div class="modal-container">

    <div class="modal-header">
      <div class="warning-icon">⚠️</div>
      <h3>Cancelar Pedido</h3>
    </div>

    <p class="modal-description">
      Describe el motivo de la cancelación. Esta acción no se puede deshacer.
    </p>

    <label class="modal-label">Motivo</label>
    <textarea
      class="modal-textarea"
      placeholder="Ej: Ingrediente no disponible..."
      [(ngModel)]="cancelReason">
    </textarea>

    <div class="modal-actions">
      <button class="btn secondary" (click)="closeCancelModal()">
        Volver
      </button>

      <button class="btn danger" (click)="confirmCancelOrder()">
        Cancelar ahora
      </button>
    </div>

  </div>
</div>
