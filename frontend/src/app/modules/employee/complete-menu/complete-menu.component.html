<!-- complete-menu.component.html -->
<app-navbar-employee></app-navbar-employee>

<div class="page-wrapper">
  <div class="content-wrapper">
    <div class="menu-header">
      <h1 class="menu-title">Menú Completo</h1>
      <p class="menu-subtitle">Explora todos los platillos disponibles en nuestro menú.</p>
    </div>

    <!-- Search -->
    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="Buscar platillo..."
        [(ngModel)]="searchTerm"
      />
    </div>

    <!-- Menu Tabs -->
    <div class="menu-tabs">
      <button
        *ngFor="let menu of menus"
        [class.active]="selectedMenu === menu.uuid"
        (click)="filterByMenu(menu.uuid)"
        class="menu-tab"
      >
        {{ menu.name }}
      </button>
    </div>

    <!-- Dishes Grid -->
    <div class="menu-content">    
      <div *ngIf="filteredDishes.length > 0; else noDishes" class="dishes-grid">
        <div *ngFor="let dish of filteredDishes" class="dish-card" [routerLink]="'/employee/dish/'+(dish.uuid)">
          <div class="dish-header">
            <h3 class="dish-name">{{ dish.name }}</h3>
            <span class="dish-price">${{ dish.cost | number:'1.2-2' }}</span>
          </div>
          <p class="dish-description">{{ dish.description }}</p>
        </div>
      </div>

      <ng-template #noDishes>
        <div class="no-dishes">
          <p>No se encontraron platillos que coincidan con tu búsqueda.</p>
        </div>
      </ng-template>
    </div>
  </div>
</div>
