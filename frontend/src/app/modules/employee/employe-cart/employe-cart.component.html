<app-navbar-employee></app-navbar-employee>

<div class="cart-page" *ngIf="!loading">

  <h1 class="cart-title">Mi Carrito</h1>

  <!-- Carrito vacío -->
  <div *ngIf="emptyCart || cartItems.length === 0" class="empty-cart">
    <p>Tu carrito está vacío</p>
    <button class="btn-secondary" (click)="goToMenu()">
      Ir al menú
    </button>
  </div>

  <!-- Carrito con items -->
  <div *ngIf="!emptyCart && cartItems.length > 0" class="cart-layout">

    <div class="cart-items">

      <div class="cart-item" *ngFor="let item of cartItems; let i = index">

        <img class="imagenP" src="/img-dashEm.jpg" alt="producto" />

        <div class="item-info">
          <h4>{{ item.name }}</h4>
          <span class="item-price">
            {{ formatCurrency(item.price) }}
          </span>
        </div>

        <div class="item-qty">
          <span>Cantidad: {{ item.quantity }}</span>
        </div>

        <button class="btn-remove" (click)="removeItem(i)" title="Eliminar producto">
          ✕
        </button>

      </div>

    </div>

    <div class="cart-summary">

      <div class="summary-row">
        <span>Subtotal</span>
        <span>{{ formatCurrency(subtotal) }}</span>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <span>{{ formatCurrency(total) }}</span>
      </div>

      <button class="btn-primary" (click)="proceedToCheckout()" [disabled]="!canCheckout || processingOrder">
        {{ processingOrder ? 'Procesando...' : 'Confirmar Pedido' }}
      </button>

      <button class="btn-secondary" (click)="goToMenu()">
        Seguir explorando menú
      </button>

      <button class="btn-danger" (click)="clearCart()" [disabled]="clearingCart">
        {{ clearingCart ? 'Vaciando...' : 'Vaciar Carrito' }}
      </button>

      <p class="cart-note">
        Puedes editar tu pedido mientras no esté en proceso
      </p>

    </div>

  </div>
</div>
