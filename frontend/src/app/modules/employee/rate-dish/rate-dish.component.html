<app-navbar-employee></app-navbar-employee>

<div class="page-wrapper">
  <div class="content-wrapper">

    <!-- Header -->
    <div class="rate-header">
      <h1>Calificar Platillo</h1>
      <p>Valora tu experiencia con este platillo.</p>
    </div>

    <div class="rate-layout">

      <!-- LEFT -->
      <div class="rate-info">
        <div class="order-info">
          <span class="label">Entregado</span>
          <h3>{{ dishName }}</h3>
          <p class="date">Ordenado el {{ orderDate }}</p>
          <span class="status">Entregado</span>
        </div>

        <div class="rating-section">
          <h4>Tu calificación</h4>

          <label class="comment-label">Comentario (opcional)</label>
          <textarea
            class="comment-box"
            placeholder="Escribe tu comentario..."
            [(ngModel)]="comment">
          </textarea>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="rate-image">
        <img src="/img-dashEm.jpg" alt="Platillo" />

        <div class="stars">
          <span
            *ngFor="let star of stars; let i = index"
            (click)="setRating(i + 1)"
            [class.filled]="i < rating">
            ★
          </span>
        </div>

        <div class="actions">
          <button class="btn-primary" (click)="submitRating()">
            Enviar Calificación
          </button>
          <button class="btn-secondary" (click)="cancel()">
            Cancelar
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
