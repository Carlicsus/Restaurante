<app-navbar-finance></app-navbar-finance>
<div class="page-wrapper">

  <div class="header">
    <h1>Panel de Finanzas</h1>
    <p>Gestiona adeudos, pagos y empleados.</p>
  </div>

  <div *ngIf="hasError" class="error-banner">
    <p>{{ errorMessage }}</p>
    <button (click)="retryLoad()" class="retry-btn">Reintentar</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats" [class.loading]="stat.loading">
      <span class="stat-title">{{ stat.title }}</span>
      <strong class="stat-value" *ngIf="!stat.loading">{{ stat.value }}</strong>
      <div class="loading-spinner" *ngIf="stat.loading"></div>
      <span
        class="stat-change"
        [class.positive]="stat.positive"
        [class.negative]="!stat.positive"
      >
        {{ stat.change }}
      </span>
    </div>
  </div>

  <div class="content-grid">

    <div class="chart-card">
      <div id="debtorsBarChart" style="width: 100%; height: 400px;"></div>
    </div>

    <div class="chart-card">
      <div id="debtorsPieChart" style="width: 100%; height: 400px;"></div>
    </div>

  </div>

</div>
